spring.datasource.url=jdbc:mysql://localhost:3306/traveleasy?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# JWT: set a long random JWT_SECRET (32+ chars) in any real deployment
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
app.jwt.expiry-minutes=120
app.cors.origin=${CORS_ORIGIN:http://localhost:5173}
# Seeded admin (created only when the users table is empty)
app.admin.email=admin@travel.com
app.admin.password=${ADMIN_PASSWORD:Admin@123}
